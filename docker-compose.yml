services:
  minio:
    image: quay.io/minio/minio:latest

    command:
      - server
      - /data
      - --console-address
      - :9001

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      timeout: 5s
      interval: 10s
      retries: 6
      start_period: 10s

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

volumes:
  minio_data:
