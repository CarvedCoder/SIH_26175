services:
  minio:
    image: quay.io/minio/minio:latest

    command:
      - server
      - /data
      - --console-address
      - :9001

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      timeout: 5s
      interval: 10s
      retries: 6
      start_period: 10s

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

  backend:
    build: .

    # Canonical backend (backend.app.main:app). .env is the canonical
    # config (Supabase auth, DW_* inference knobs); the entries under
    # `environment:` override it for in-compose networking and CORS.
    env_file: .env

    environment:
      # Inside the compose network MinIO is the `minio` host, not
      # localhost (the .env default is for host-side dev).
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # Browser talks to the backend from the host at :5173.
      DW_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DW_DEVICE: auto
      # Supabase's direct db.* host is IPv6-only; Docker's default bridge
      # network has no IPv6, so the container cannot resolve/connect to it
      # (backend crash-looped on startup → uploads 5xx). Containers run on
      # the bound-mounted SQLite DB instead; host-side runs keep the
      # Supabase DATABASE_URL from .env.
      DATABASE_URL: sqlite:////app/data/depthwizard.db

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # Trained checkpoint (outputs/calib_net/gamus_rgb_grad/best.pt)
      # plus service outputs and scene data persist on the host.
      - ./outputs:/app/outputs
      - ./data:/app/data

    depends_on:
      minio:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build: ./frontend

    ports:
      - "127.0.0.1:5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  minio_data:
