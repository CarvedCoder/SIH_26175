# DepthWizard — full stack: Python inference service
#
#   docker compose up --build
#     backend -> http://localhost:8000  (health: /health, predict: /predict)
#
# Your trained flagship checkpoint is read from ./outputs on the host:
#   outputs/calib_net/rgb_cos/best.pt
# Train locally first (`python model.py train --use-rgb --cosine --out-tag rgb_cos`).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: depthwizard-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      # Optional: cache HuggingFace weights between container restarts so
      # the live DAv2 fallback does not re-download ~1.3 GB every run.
      - dwhf:/root/.cache/huggingface
    environment:
      DW_ROOT: /app
      DW_CKPT: /app/outputs/calib_net/rgb_cos/best.pt
      DW_OUT_ROOT: /app/outputs/service
      DW_DEVICE: auto
      DW_CORS_ORIGINS: "*"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      
volumes:
  dwhf:
