services:
  rustfs:
    image: rustfs/rustfs:latest

    # RustFS — self-hosted S3-compatible object storage (drop-in MinIO
    # replacement). S3 API on 9000, web console on 9001. No license
    # mechanism; credentials come from .env (S3_ACCESS_KEY/S3_SECRET_KEY).
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Browser origins allowed to fetch presigned URLs cross-origin
      # (the frontend fetches height/preview artifacts directly from here).
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/health
      timeout: 5s
      interval: 10s
      retries: 6
      start_period: 10s

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - rustfs_data:/data

    restart: unless-stopped

  backend:
    build: .

    # Canonical backend (backend.app.main:app). .env is the canonical
    # config (Supabase auth, DW_* inference knobs); the entries under
    # environment: override it for in-compose networking and CORS.
    env_file: .env

    environment:
      # Inside the compose network RustFS is the rustfs host, NOT
      # localhost (the .env default is for host-side dev). S3_PUBLIC_ENDPOINT
      # is what presigned URLs embed — that host must be reachable from the
      # BROWSER, which runs on the host.
      STORAGE_BACKEND: s3
      S3_ENDPOINT: rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_SECURE: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-depthwizard}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Browser talks to the backend from the host at :5173.
      DW_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DW_DEVICE: auto
      # TerraHeight-S external checkpoint (set to a real path to enable the
      # terraheight_s height backend; never auto-downloaded)
      DW_CKPT_TERRAHEIGHT: ${DW_CKPT_TERRAHEIGHT:-}
      # Supabase's direct db.* host is IPv6-only; Docker's default bridge
      # network has no IPv6, so the container cannot resolve/connect to it
      # (backend crash-looped on startup → uploads 5xx). Containers run on
      # the bound-mounted SQLite DB instead; host-side runs keep the
      # Supabase DATABASE_URL from .env.
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # Trained checkpoint (outputs/calib_net/gamus_rgb_grad/best.pt)
      # plus service outputs and scene data persist on the host.
      - ./outputs:/app/outputs
      - ./data:/app/data

    depends_on:
      rustfs:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build: ./frontend

    ports:
      - "127.0.0.1:5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  rustfs_data:
