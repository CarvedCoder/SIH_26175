# DepthWizard — canonical stack.
#
#   docker compose up --build
#     backend -> http://localhost:8000  (health: /api/v1/health, docs: /docs)
#
# The backend deploys backend.app.main:app — the /api/v1 scene/job API the
# React frontend uses. Point the frontend at it with VITE_API_BASE_URL in
# frontend/.env (see frontend/.env.example).
#
# A trained flagship checkpoint is expected under ./outputs:
#   outputs/calib_net/<tag>/best.pt   (train: `python model.py train ...`)
# Set DW_CKPT to select a different one. model_loaded in /api/v1/health
# reports honestly whether the checkpoint is present.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: depthwizard-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      # Cache HuggingFace weights between restarts so the live DAv2
      # fallback does not re-download ~1.3 GB every run.
      - dwhf:/home/dw/.cache/huggingface
    environment:
      DW_ROOT: /app
      DW_DEVICE: auto
      DW_OUT_ROOT: /app/outputs/service
      # Explicit CORS allowlist — never '*'. Add your deployed frontend
      # origin here for non-local deployments.
      DW_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      # Set a key to require X-API-Key on every scene/job route:
      # DW_API_KEY: "change-me"
      # Upload cap (bytes), inference concurrency, job retention:
      DW_MAX_UPLOAD_BYTES: "524288000" # 500 MB
      DW_MAX_CONCURRENT_JOBS: "1"
      DW_JOB_TTL_SECONDS: "86400"
    # The image runs as uid 10001 (non-root). If bind-mount permission
    # errors occur, uncomment and match your host user:
    # user: "${DW_UID}:${DW_GID}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=8)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  dwhf:
