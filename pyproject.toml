[project]
name = "depthwizard"
version = "1.0.0"
description = "DepthWizard — DAv2 + CalibrationNet monocular height estimation (ML pipeline + FastAPI serving stack)"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    # ML core (shared by training CLI and serving stack)
    "torch==2.13.0",
    "transformers==5.15.1",    # AutoModelForDepthEstimation (Depth Anything V2)
    "rasterio==1.5.1",
    "numpy==2.5.1",
    "pyyaml==6.0.3",
    "pillow==12.3.0",
    "matplotlib==3.11.1",       # DSM preview PNGs
    "tqdm==4.70.0",            # CLI progress only
    "scipy==1.18.1",           # depthwizard.demprior: separable Gaussian
    "h5py==3.16.0",            # GAMUS ingestion (lazy)
    "huggingface-hub==1.28.0", # GAMUS lazy download
    # Disaster assessment (HOTOSM ONNX models + polygonization)
    "onnxruntime-gpu==1.30.0",
    "shapely==2.1.2",
    "requests==2.34.2",
    # Serving stack (backend.app)
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    # SQL persistence (Supabase/PostgreSQL via SQLAlchemy)
    "sqlalchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    # Supabase JWT verification
    "pyjwt[crypto]==2.14.0",
    # S3-compatible object storage (RustFS)
    "boto3==1.43.98",
    "psycopg2-binary==2.9.13",
    "affine==3.0.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "click==8.4.2",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "contourpy==1.3.3",
    "cuda-bindings==13.3.1 ; python_full_version < '3.15' and sys_platform == 'linux'",
    "cuda-pathfinder==1.5.6 ; python_full_version < '3.15' and sys_platform == 'linux'",
    "cuda-toolkit==13.0.3.0 ; sys_platform == 'linux'",
    "cycler==0.12.1",
    "filelock==3.31.0",
    "fonttools==4.63.0",
    "fsspec==2026.6.0",
    "h11==0.16.0",
    "hf-xet==1.6.0 ; platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'arm64' or platform_machine == 'x86_64'",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "jinja2==3.1.6",
    "kiwisolver==1.5.0",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "nvidia-cublas==13.1.1.3 ; sys_platform == 'linux'",
    "nvidia-cuda-cupti==13.0.85 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-cuda-nvrtc==13.0.88 ; sys_platform == 'linux'",
    "nvidia-cuda-runtime==13.0.96 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-cudnn-cu13==9.20.0.48 ; sys_platform == 'linux'",
    "nvidia-cufft==12.0.0.61 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-cufile==1.15.1.6 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-curand==10.4.0.35 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-cusolver==12.0.4.66 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-cusparse==12.6.3.3 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-cusparselt-cu13==0.8.1 ; sys_platform == 'linux'",
    "nvidia-nccl-cu13==2.29.7 ; sys_platform == 'linux'",
    "nvidia-nvjitlink==13.3.33 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "nvidia-nvshmem-cu13==3.4.5 ; sys_platform == 'linux'",
    "nvidia-nvtx==13.0.85 ; (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'x86_64' and sys_platform == 'linux')",
    "packaging==26.3",
    "pydantic-core==2.46.4",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "regex==2026.7.19",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "setuptools==83.0.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "starlette==1.3.1",
    "sympy==1.14.0",
    "tokenizers==0.22.2",
    "triton==3.7.1 ; python_full_version < '3.15' and sys_platform == 'linux'",
    "typer==0.27.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "botocore==1.43.98",
    "s3transfer==0.19.2",
    "cryptography==50.0.1",
    "cffi==2.1.1 ; platform_python_implementation != 'PyPy'",
    "charset-normalizer==3.5.2",
    "flatbuffers==25.12.19",
    "greenlet==3.5.6 ; platform_machine == 'AMD64' or platform_machine == 'WIN32' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'ppc64le' or platform_machine == 'win32' or platform_machine == 'x86_64'",
    "iniconfig==2.3.0",
    "jmespath==1.1.0",
    "pluggy==1.6.0",
    "protobuf==7.36.2",
    "psycopg-binary==3.3.6 ; implementation_name != 'pypy'",
    "pybind11==3.1.0",
    "pycparser==3.0 ; implementation_name != 'PyPy' and platform_python_implementation != 'PyPy'",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "tzdata==2026.4 ; sys_platform == 'win32'",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27", # FastAPI TestClient transport
    "pybind11>=2.12", # build-time only: compiles native/ (dw_native)
]

[tool.uv]
# The repo runs from the source tree (no package build/install); uv
# manages dependencies only. Keeps `uv sync --frozen` usable in Docker
# without a setuptools flat-layout package build.
package = false

[tool.pytest.ini_options]
testpaths = ["model_tests", "tests", "backend_tests"]
