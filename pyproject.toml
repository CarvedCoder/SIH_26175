[project]
name = "depthwizard"
version = "1.0.0"
description = "DepthWizard — DAv2 + CalibrationNet monocular height estimation (ML pipeline + FastAPI serving stack)"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    # ML core (shared by training CLI and serving stack)
    "torch>=2.2",
    "transformers>=4.44",    # AutoModelForDepthEstimation (Depth Anything V2)
    "rasterio>=1.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "matplotlib>=3.8",       # DSM preview PNGs
    "tqdm>=4.66",            # CLI progress only
    "scipy>=1.11",           # depthwizard.demprior: separable Gaussian
    "h5py>=3.10",            # GAMUS ingestion (lazy)
    "huggingface_hub>=0.23", # GAMUS lazy download
    # Serving stack (backend.app)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27", # FastAPI TestClient transport
]

[tool.pytest.ini_options]
testpaths = ["model_tests", "tests", "backend_tests"]
