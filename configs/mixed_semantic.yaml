paths:
  depth_cache_dir: outputs/depth_cache
  outputs_dir: outputs
  affine_json: outputs/baseline/global_affine_gamus.json
  splits_json: outputs/splits/splits.json

dataset:
  name: mixed
  verified_stats: outputs/stats/dataset_stats.json

  sources:
    - name: gamus
      weight: 0.8
      source: local
      backend: hdf5
      local_root: gamus_full
      manifest: outputs/splits/gamus_splits.json
      limit: 0
      load_semantics: true

    - name: dfc2019
      weight: 0.2
      rgb_dir: Train-Track1-RGB/Track1-RGB
      truth_dir: Train-Track1-Truth/Track1-Truth
      splits_json: outputs/splits/splits.json
      load_semantics: true

model:
  use_rgb: true
  widths: [16, 32, 64]
  clamp_min: 0.0

train:
  crop_size: 512
  batch_size: 1
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0
  loss: l1
  huber_delta: 5.0
  workers: 1
  val_subset: 48
  patience: 8
  seed: 42
  w_grad: 0.1
  w_slope: 0.05
  w_smooth: 0.0
  w_sem: 0.2