# Inference + service configuration — shared by `python model.py infer`
# and the FastAPI service (service/api.py). Paths relative to the repo root.

paths:
  rgb_dir: rgb_data/Train-Track1-RGB/Track1-RGB
  truth_dir: rgb_data_truth/Train-Track1-Truth/Track1-Truth
  splits_json: outputs/splits/splits.json
  depth_cache_dir: outputs/depth_cache
  outputs_dir: outputs

model:
  # Height-model backend (RDAH integration) — the DEFAULT after integration.
  #   rdah             official RDAH-Net (HeightPredTransformer) with the
  #                    released pretrained Track1 checkpoint; depth input is
  #                    RAW DAv2 x depth_scale (NOT min-max); output = nDSM
  #                    metres. See depthwizard/rdah.py.
  #   calibration_net  the legacy Phase-2 net (H = clamp(a*Dn + b, 0), Dn
  #                    min-max [0,1] per tile) — kept fully functional for
  #                    A/B comparison: set architecture: calibration_net and
  #                    point infer.checkpoint at a trained best.pt.
  architecture: rdah
  # Pretrained official checkpoint (auto-downloads + MD5-verifies on first
  # use from figshare article 31986864 when missing — depthwizard/rdah.py).
  checkpoint: checkpoints/rdah/rdah_track1_best_model.pth
  pretrained: true
  # Depth Anything V2 stays FROZEN as the depth backbone (never trained);
  # documented for clarity — see depthwizard/backbone.py.
  freeze_depth_anything: true
  # RDAH depth input = raw DAv2 relative depth x depth_scale (the constant
  # verified against the released checkpoint's BN statistics; 35-45 is
  # empirically flat — see depthwizard/rdah.py module docstring).
  depth_scale: 40.0

infer:
  # Legacy CalibrationNet checkpoints were referenced here pre-RDAH; the
  # height backend above (model.checkpoint) owns the path now. Switch the
  # backend back via:  architecture: calibration_net + a trained best.pt.
  device: auto                  # auto | cuda | cpu
  mode: auto                    # auto | crop | resize | tiles
  # Live Depth-Anything-V2 when no cached Dn exists (arbitrary uploads).
  # First call downloads weights from HuggingFace — see depthwizard/backbone.py.
  live_backbone: true
  # Aligned to ViT-B (Phase 0.2): the SAME variant the training cache was
  # built with — live Dn stays distribution-consistent with cached Dn.
  backbone: depth-anything/Depth-Anything-V2-Base-hf

dem:
  # Automatic reference-DEM acquisition for the ABSOLUTE DSM product
  # (Part A — docs/absolute_dsm.md). "none" keeps --anchor-dem as the
  # only DEM path. "copernicus" fetches Copernicus GLO-30 public COGs
  # from the AWS Open Data registry (network required, tiles cached);
  # on retrieval failure the run falls back to the RELATIVE product
  # with an explicit notice — never fake data.
  provider: none                # none | copernicus
  cache_dir: outputs/dem_cache  # DEM tile/mosaic cache
